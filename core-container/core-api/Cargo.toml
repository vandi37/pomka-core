[package]
name = "core-api"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.50", features = ["full"] }
axum = "0.8.9"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "postgres",  "chrono", "macros", "uuid", "rust_decimal"] }
redis = {version = "1.6.0", features = ["tokio-comp", "connection-manager"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.151"
chrono = { version = "0.4.45", features = ["serde"] }
uuid = { version = "1.26.0", features = ["v4", "serde"] }
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3.23", features = ["fmt", "json", "env-filter"] }
tracing-appender = "0.2.5"
tracing-error = "0.2"
tower-http = { version = "0.7", features = ["trace", "cors"] }
jsonwebtoken = {version = "11.0.0", features = ["rust_crypto"]}
signed_token = {path="signed_token"}
argon2 = "0.6.0"
password-hash = "0.6.1"
lazy-regex = "3.6.1"
rust_decimal = {version="1.42.1", features=["macros"]}