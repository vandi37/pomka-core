[package]
name = "core-api"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.50", features = ["full"] }
axum = "0.8.8"
sqlx = { version = "0.8.6", features = ["runtime-tokio", "postgres",  "chrono", "macros"] }
redis = {version = "1.0.4", features = ["tokio-comp", "connection-manager"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4.44", features = ["serde"] }
uuid = { version = "1.14.0", features = ["v4", "serde"] }
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "json", "env-filter"] }
tracing-appender = "0.2"
tracing-error = "0.2"
tower-http = { version = "0.6.8", features = ["trace", "cors"] }
jsonwebtoken = {version = "10.3.0", features = ["rust_crypto"]}
signed_token = {path="signed_token"}
argon2 = "0.5"
rand_core = "0.6.0"